<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LUXE | Premium Horology</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f172a;
            --accent-gold: #fbbf24;
            --accent-indigo: #6366f1;
            --bg-light: #f8fafc;
            --card-white: #ffffff;
            --subtle-border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background-color: var(--bg-light);
            color: var(--primary);
            padding-bottom: 100px;
            transition: background 0.2s;
        }

        /* header with auth row */
        .main-header {
            background: linear-gradient(135deg, var(--primary), #1e293b);
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .brand h1 {
            font-size: 1.9rem;
            letter-spacing: -0.5px;
        }

        .brand p {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 4px;
        }

        .auth-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-outline-light {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            color: white;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-outline-light:hover {
            background: white;
            color: var(--primary);
            border-color: white;
        }

        .btn-gold {
            background: var(--accent-gold);
            border: none;
            color: var(--primary);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-gold:hover {
            background: #ffd966;
            transform: scale(1.02);
        }

        .user-greeting {
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* login modal (clean overlay) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: white;
            max-width: 400px;
            width: 90%;
            padding: 2rem;
            border-radius: 28px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .modal-card h3 {
            margin-bottom: 1rem;
        }

        .modal-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 14px;
            font-size: 1rem;
        }

        .modal-card button {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        .close-modal {
            background: #e2e8f0;
            color: #333;
            margin-top: 8px;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .container {
            max-width: 1280px;
            margin: 2rem auto;
            padding: 0 24px;
        }

        /* grid: 3 per row desktop */
        .watch-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .watch-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 680px) {
            .watch-grid {
                grid-template-columns: 1fr;
            }

            .header-top {
                flex-direction: column;
                text-align: center;
            }

            .auth-buttons {
                justify-content: center;
            }
        }

        .watch-card {
            background: var(--card-white);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.05);
            transition: transform 0.25s ease, box-shadow 0.2s;
            border: 1px solid var(--subtle-border);
            display: flex;
            flex-direction: column;
        }

        .watch-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 32px rgba(0, 0, 0, 0.12);
        }

        .watch-image {
            width: 100%;
            height: 260px;
            object-fit: cover;
            background: #f1f5f9;
        }

        .card-content {
            padding: 1.5rem;
            text-align: center;
        }

        .price {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-indigo);
            margin: 0.5rem 0;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 1rem;
        }

        .add-btn,
        .remove-btn {
            padding: 10px 0;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-btn {
            background: var(--primary);
            color: white;
            flex: 2;
        }

        .add-btn:hover {
            background: var(--accent-indigo);
        }

        .remove-btn {
            background: #fee2e2;
            color: var(--danger);
            flex: 1;
        }

        .remove-btn:hover {
            background: #ffc9c9;
        }

        .qty-badge {
            background: var(--accent-indigo);
            padding: 2px 8px;
            border-radius: 40px;
            font-size: 0.7rem;
            margin-left: 6px;
            color: white;
        }

        /* floating cart */
        .cart-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 850px;
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(12px);
            color: white;
            padding: 0.9rem 2rem;
            border-radius: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            z-index: 1100;
            flex-wrap: wrap;
            gap: 12px;
        }

        .confirm-link {
            background: var(--accent-gold);
            color: var(--primary);
            padding: 10px 26px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .confirm-link:hover {
            background: #ffdd88;
            transform: scale(1.02);
        }

        .cart-summary-text {
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        .disabled-overlay {
            pointer-events: none;
            opacity: 0.5;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <header class="main-header">
        <div class="header-top">
            <div class="brand">
                <h1>LUXE TIMEPIECES</h1>
                <p>Precision Engineering · Timeless Heritage</p>
            </div>
            <div class="auth-buttons" id="authSection">
                <!-- dynamic: either login or user greeting + logout -->
            </div>
        </div>
    </header>

    <div class="container">
        <div class="watch-grid" id="watchGrid"></div>
    </div>

    <div class="cart-bar" id="cartBar">
        <div id="cartSummary" class="cart-summary-text">Your Cart is Empty</div>
        <a href="#" id="checkoutBtn" class="confirm-link">Confirm Order →</a>
    </div>

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="modal">
        <div class="modal-card">
            <h3>Access LUXE</h3>
            <p style="color:#475569; margin-bottom: 12px;">Sign in to add watches & checkout</p>
            <input type="text" id="loginUsername" placeholder="Username (e.g., James)" autocomplete="off">
            <input type="password" id="loginPassword" placeholder="Password (anything ≥ 3 chars)">
            <div id="loginError" class="error-msg"></div>
            <button id="modalLoginBtn">Login / Sign Up</button>
            <button id="closeModalBtn" class="close-modal">Cancel</button>
        </div>
    </div>

    <script>
        // ---------- WATCH COLLECTION ----------
        const watches = [
            { id: 1, name: "Onyx Executive", price: 1250, img: "https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=500&h=500" },
            { id: 2, name: "Midnight Navigator", price: 890, img: "https://images.unsplash.com/photo-1522312346375-d1a52e2b99b3?auto=format&fit=crop&w=500&h=500" },
            { id: 3, name: "Rose Gold Limited", price: 2100, img: "https://images.unsplash.com/photo-1612817159949-195b6eb9e31a?q=80&w=1000&auto=format&fit=crop&h=500" },
            { id: 4, name: "Alpine Silver", price: 750, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&h=500" },
            { id: 5, name: "Deep Sea Diver", price: 1400, img: "https://images.unsplash.com/photo-1614164185128-e4ec99c436d7?auto=format&fit=crop&w=500&h=500" },
            { id: 6, name: "Titanium Sport", price: 620, img: "https://images.unsplash.com/photo-1542496658-e33a6d0d50f6?auto=format&fit=crop&w=500&h=500" }
        ];

        // ----- AUTH STATE (session + localStorage persistence) -----
        let currentUser = null;

        // Load session from localStorage
        function loadAuthSession() {
            const storedUser = localStorage.getItem('luxe_user');
            if (storedUser) {
                currentUser = storedUser;
            } else {
                currentUser = null;
            }
        }

        // Save session
        function saveAuthSession(username) {
            if (username) {
                localStorage.setItem('luxe_user', username);
                currentUser = username;
            } else {
                localStorage.removeItem('luxe_user');
                currentUser = null;
            }
        }

        // Cart: each user has own cart stored as "cart_username"
        function getCartKey() {
            if (!currentUser) return null;
            return `luxe_cart_${currentUser}`;
        }

        function loadCart() {
            if (!currentUser) return {};
            const key = getCartKey();
            const stored = localStorage.getItem(key);
            return stored ? JSON.parse(stored) : {};
        }

        function saveCart(cartData) {
            if (!currentUser) return;
            const key = getCartKey();
            localStorage.setItem(key, JSON.stringify(cartData));
        }

        let cart = {};

        function syncCartFromStorage() {
            if (!currentUser) {
                cart = {};
            } else {
                cart = loadCart();
            }
        }

        // Helper to update all UI after auth/cart changes
        function refreshFullUI() {
            syncCartFromStorage();
            updateUI();
            updateAuthUI();
        }

        // update product cards & cart bar
        function updateUI() {
            const grid = document.getElementById('watchGrid');
            if (!grid) return;
            grid.innerHTML = '';

            watches.forEach(watch => {
                const qty = cart[watch.id] ? cart[watch.id].qty : 0;
                const card = document.createElement('div');
                card.className = 'watch-card';
                card.innerHTML = `
                <img src="${watch.img}" class="watch-image" alt="${watch.name}" loading="lazy">
                <div class="card-content">
                    <h3>${watch.name} ${qty > 0 ? `<span class="qty-badge">${qty}</span>` : ''}</h3>
                    <p class="price">$${watch.price.toLocaleString()}</p>
                    <div class="btn-group">
                        <button class="add-btn" data-id="${watch.id}" data-action="add">Add to Cart</button>
                        ${qty > 0 ? `<button class="remove-btn" data-id="${watch.id}" data-action="remove">Remove</button>` : ''}
                    </div>
                </div>
            `;
                grid.appendChild(card);
            });

            // attach event listeners dynamically
            document.querySelectorAll('.add-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    addToCart(id);
                });
            });
            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = parseInt(btn.dataset.id);
                    removeFromCart(id);
                });
            });

            // update cart summary bar
            const totalItems = Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = Object.values(cart).reduce((sum, item) => sum + (item.qty * item.price), 0);
            const cartSummaryDiv = document.getElementById('cartSummary');
            if (cartSummaryDiv) {
                cartSummaryDiv.innerHTML = totalItems > 0
                    ? `<strong>${totalItems}</strong> items &nbsp;|&nbsp; 💵 $${totalPrice.toLocaleString()}`
                    : "Your Cart is Empty";
            }

            // save cart only if logged in
            if (currentUser) {
                saveCart(cart);
            }

            // store total for checkout reference
            localStorage.setItem('finalTotal', totalPrice);
        }

        function addToCart(id) {
            if (!currentUser) {
                showLoginModalWithMessage("Please login to add items to your cart.");
                return;
            }
            const watch = watches.find(w => w.id === id);
            if (!watch) return;
            if (cart[id]) {
                cart[id].qty++;
            } else {
                cart[id] = { name: watch.name, price: watch.price, qty: 1 };
            }
            updateUI();
        }

        function removeFromCart(id) {
            if (!currentUser) {
                showLoginModalWithMessage("Please login to modify cart.");
                return;
            }
            if (cart[id]) {
                cart[id].qty--;
                if (cart[id].qty <= 0) delete cart[id];
            }
            updateUI();
        }

        // ----- AUTH UI (login/logout) -----
        function updateAuthUI() {
            const authSection = document.getElementById('authSection');
            if (!authSection) return;
            if (currentUser) {
                authSection.innerHTML = `
                <div class="user-greeting">
                    ✨ Welcome, ${currentUser} 
                </div>
                <button id="logoutBtn" class="btn-outline-light">Logout</button>
            `;
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) logoutBtn.addEventListener('click', logoutHandler);
            } else {
                authSection.innerHTML = `
                <button id="showLoginBtn" class="btn-outline-light">Login / Register</button>
            `;
                const loginBtn = document.getElementById('showLoginBtn');
                if (loginBtn) loginBtn.addEventListener('click', () => showLoginModal());
            }
        }

        function logoutHandler() {
            // clear current session and cart memory
            saveAuthSession(null);
            currentUser = null;
            cart = {};
            // clear any temporary cart from local but we keep other users data untouched
            // remove cart from ui
            updateUI();
            updateAuthUI();
            // Also clear any cross-user artifacts
            localStorage.removeItem('finalTotal');
        }

        // modal logic
        const modal = document.getElementById('loginModal');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginErrorSpan = document.getElementById('loginError');
        const modalLoginBtn = document.getElementById('modalLoginBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function showLoginModalWithMessage(msg = "") {
            if (loginErrorSpan) loginErrorSpan.innerText = msg;
            modal.style.display = 'flex';
            loginUsername.value = '';
            loginPassword.value = '';
        }

        function showLoginModal() {
            if (loginErrorSpan) loginErrorSpan.innerText = "";
            modal.style.display = 'flex';
            loginUsername.value = '';
            loginPassword.value = '';
        }

        function closeModal() {
            modal.style.display = 'none';
            if (loginErrorSpan) loginErrorSpan.innerText = "";
        }

        function performLogin() {
            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();
            if (!username) {
                loginErrorSpan.innerText = "Username is required";
                return;
            }
            if (password.length < 1) {
                loginErrorSpan.innerText = "Please enter a password (any)";
                return;
            }
            // simple acceptance: any non-empty username acts as login/register
            saveAuthSession(username);
            currentUser = username;
            // after login, load this user's cart from localStorage
            syncCartFromStorage();
            updateUI();
            updateAuthUI();
            closeModal();
            // optional success feedback
        }

        modalLoginBtn.addEventListener('click', performLogin);
        closeModalBtn.addEventListener('click', closeModal);
        window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        loginUsername.addEventListener('keypress', (e) => { if (e.key === 'Enter') performLogin(); });
        loginPassword.addEventListener('keypress', (e) => { if (e.key === 'Enter') performLogin(); });

        // ----- CHECKOUT REDIRECT (bill.html) with login guard -----
        const checkoutBtn = document.getElementById('checkoutBtn');
        if (checkoutBtn) {
            checkoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                if (!currentUser) {
                    showLoginModalWithMessage("Please login before confirming your order.");
                    return;
                }
                const totalItems = Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
                if (totalItems === 0) {
                    alert("Your cart is empty. Add some luxury timepieces first.");
                    return;
                }
                // pass current cart snapshot to bill page (already in localStorage keys)
                // ensure finalTotal is updated
                const totalPrice = Object.values(cart).reduce((sum, item) => sum + (item.qty * item.price), 0);
                localStorage.setItem('finalTotal', totalPrice);
                // Redirect to bill page (which we will generate similarly with login check on that page too)
                window.location.href = 'bill.html';
            });
        }

        // Init: load session, cart, render
        loadAuthSession();
        syncCartFromStorage();
        updateUI();
        updateAuthUI();

        // Prevent checkout if not logged in also on cart bar style but we already guard
    </script>


</body>

</html>
